name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Test backend
        run: npm run test:backend

      - name: Install backend bundler
        run: python -m pip install -r backend/requirements-bundle.txt

      - name: Build backend sidecar
        run: npm run backend:bundle

      - name: Build frontend
        run: npm run build

      - name: Build Tauri desktop app
        run: npm run tauri build -- --ci

      - name: Upload Windows app and installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ml-lab-studio-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/ml-lab-studio.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload macOS app and installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ml-lab-studio-macos-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/macos/ML Lab Studio.app
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
