[package]
name = "ml-lab-studio"
version = "0.1.0"
description = "ML Lab Studio desktop app"
authors = ["ML Lab Studio"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "ml_lab_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
